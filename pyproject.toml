[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shani-chronoa-extras"
version = "0.1.0"
description = "Specialist system, network, driver, container and model tools for the Chronoa assistant"
readme = "README.md"
requires-python = ">=3.11"
# moved out of shani-chronoa, so under its licence
license = { text = "GPL-3.0-only" }
# The moved skills use only the standard library plus modules already shipped
# by Chronoa (files, config, sysfs, sense_reading, egress, netprovision). The
# ML harnesses additionally use numpy, which Chronoa's model work already
# declares for its own optional paths.
dependencies = []

[project.optional-dependencies]
ml = ["numpy"]

[project.scripts]
shani-chronoa-extras = "shani_sysadmin.__main__:main"
# the name Chronoa's messages and older notes use
shani-sysadmin = "shani_sysadmin.__main__:main"

[tool.setuptools]
packages = [
    "shani_sysadmin",
    "shani_sysadmin.skills",
    "shani_sysadmin.senses",
    "shani_sysadmin.ml_harness",
]
